<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimized FAB - Particle Ripple Screen Wave</title>
  <style>
    body { margin: 0; padding: 20px; min-height: 100vh; font-family: sans-serif; box-sizing: border-box; background: #111318 radial-gradient(circle at 20% 30%, rgba(28,33,46,0.7) 0%, transparent 50%) radial-gradient(circle at 80% 70%, rgba(36,26,38,0.5) 0%, transparent 50%) linear-gradient(135deg, #0f1115 0%, #171b26 100%); overflow-x: hidden; }
    .b { width: 56px; height: 56px; border-radius: 50%; background: #fff; color: #dc3545; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.4); -webkit-tap-highlight-color: transparent; outline: none; transition: transform .25s ease, background .25s ease, color .25s ease, opacity .25s ease; }
    .b:hover { transform: scale(1.1); background: #dc3545; color: #fff; }
    .box { position: fixed; bottom: 30px; left: 20px; display: flex; align-items: center; gap: 20px; z-index: 999; }
    .box::before, .box::after { content: ''; position: absolute; bottom: -17px; left: -27px; width: 110px; height: 110px; border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(0); will-change: transform, opacity; }
    .box::before { border: 2px solid rgba(220, 53, 69, 0.4); box-shadow: inset 0 0 15px rgba(220, 53, 69, 0.2); }
    .box::after { border: 1px dashed rgba(0, 198, 255, 0.3); }
    @keyframes screen-ripple { 0% { transform: scale(0); opacity: 1; } 20% { opacity: 0.8; } 100% { transform: scale(25); opacity: 0; } }
    #chk:checked ~ ::before { animation: screen-ripple 0.85s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
    #chk:checked ~ ::after { animation: screen-ripple 1s cubic-bezier(0.1, 0.8, 0.3, 1) 0.08s forwards; }
    .opts { display: flex; gap: 20px; opacity: 0; visibility: hidden; transform: translateX(-20px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease, visibility 0s ease 0.25s; }
    .node { position: relative; transform: scale(0); opacity: 0; transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease; }
    .m { width: 60px; height: 60px; font-size: 16px; border: 2px solid #dc3545; }
    .s { position: relative; width: 55px; height: 55px; border: none; background: #fff; transition: transform 0.35s cubic-bezier(0.68, -1.2, 0.25, 2.1), opacity 0.25s ease; }
    @keyframes shelf-bounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.05); } }
    .node:focus-within .m, .node:hover .m { animation: shelf-bounce 1.2s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
    @keyframes border-wave { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .s::before, .main::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, #ff416c, #f8b500, #11998e, #007bff, #ff416c); background-size: 300% 300%; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
    .node:focus-within .v .b::before, .m:focus + .v .b::before, .v:hover .b::before, #chk:checked + .main::before { animation: border-wave 4s linear infinite; }
    /* Animate shelf items' rainbow border while shelf is open */
    .node:focus-within .s::before, .node:hover .s::before, .m:focus + .v .s::before, .v:hover .s::before { animation: border-wave 4s linear infinite; }
    @keyframes crackle { 0% { transform: scale(0.8) rotate(0deg); opacity: 0.8; } 50% { opacity: 0.4; border-style: dotted; } 100% { transform: scale(1.3) rotate(180deg); opacity: 0; } }
    .s::after { content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px; border-radius: 50%; border: 3px dashed currentColor; opacity: 0; transform: scale(0.6); pointer-events: none; }
    .node:focus-within .v .b::after, .m:focus + .v .b::after, .v:hover .b::after { animation: crackle 0.8s linear infinite; }
    .v .b:nth-child(1)::after { animation-duration: 0.6s; color: #ff416c; } .v .b:nth-child(2)::after { animation-duration: 0.9s; color: #f8b500; } .v .b:nth-child(3)::after { animation-duration: 0.75s; color: #11998e; }
    @keyframes rainbow-spark-color { 0% { color: #ff416c; } 25% { color: #f8b500; } 50% { color: #11998e; } 75% { color: #007bff; } 100% { color: #ff416c; } }
    .main { position: relative; background: #dc3545; color: #fff; z-index: 10; user-select: none; border: none; }
    .main::after { content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px; border-radius: 50%; border: 3px dashed currentColor; pointer-events: none; z-index: -1; animation: crackle 0.7s linear infinite, rainbow-spark-color 4s linear infinite; }
    .main svg, .m svg { display: block; width: 24px; height: 24px; fill: currentColor; }
    .node:first-child > .m svg { width: 29px; height: 29px; transform: translate(-2px, 2px); }
    .main svg { transition: transform .2s cubic-bezier(0.25, 1, 0.5, 1); }
    #chk:checked + .main { transform: scale(0.78); background: #fff; color: #dc3545; }
    #chk:checked + .main svg { transform: scale(0.85); }
    #chk { display: none; }
    #chk:checked ~ .opts { opacity: 1; visibility: visible; transform: translateX(0); transition-delay: 0s; }
    #chk:checked ~ .opts .node { transform: scale(1); opacity: 1; }
    .v { position: absolute; bottom: 75px; left: 50%; display: flex; flex-direction: column-reverse; gap: 35px; align-items: center; opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(-50%) translateY(20px); will-change: transform, opacity; transition: transform 0.45s cubic-bezier(0.68, -1.2, 0.25, 2.1), opacity 0.25s ease, visibility 0s ease 0.15s; }
    .v .b { transform: scale(0); opacity: 0; }
    .m:focus + .v, .node:focus-within .v, .v:hover { opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(-50%) translateY(0); transition-delay: 0s; }
    .m:focus + .v .b, .node:focus-within .v .b, .v:hover .b { transform: scale(1) translateZ(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="box">
    <input type="checkbox" id="chk">
    <label for="chk" class="b main"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></label>
    <div class="opts">
      <div class="node"><button class="b m" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.5 7.5 0 0 0 .05-1.88l2.03-1.58-2-3.46-2.42.98a7.4 7.4 0 0 0-1.63-.94L14.8 3h-4l-.37 3.06a7.4 7.4 0 0 0-1.63.94l-2.42-.98-2 3.46 2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58 2 3.46 2.42-.98c.5.39 1.05.7 1.63.94L10.8 21h4l.37-3.06c.58-.24 1.13-.55 1.63-.94l2.42.98 2-3.46-2.08-1.58ZM12.8 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button><div class="v"><button class="b s"></button><button class="b s"></button><button class="b s"></button></div></div>
      <div class="node"><button class="b m" aria-label="Folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-10Z"/></svg></button><div class="v"><button class="b s"></button><button class="b s"></button><button class="b s"></button></div></div>
      <div class="node"><button class="b m" aria-label="Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6H3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3l2-2h8l2 2h3a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2ZM8 13H6v2H4v-2H2v-2h2V9h2v2h2v2Zm7.5 1.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3-3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/></svg></button><div class="v"><button class="b s"></button><button class="b s"></button><button class="b s"></button></div></div>
      <div class="node"><button class="b m">Set</button><div class="v"><button class="b s"></button><button class="b s"></button><button class="b s"></button></div></div>
    </div>
  </div>
</body>
</html>
